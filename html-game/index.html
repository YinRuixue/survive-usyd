<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#211e1b">
<title>Survive USYD</title>
<meta name="description" content="A pixel-art semester survival game. Plan your weeks, meet your classmates, and make it through USYD.">
<!-- Versioned assets prevent an older cached engine from surviving a game update. -->
<link rel="stylesheet" href="style.css?v=9a1c45d9ab21">
<script defer src="game-data.js?v=8912d4fabab0"></script>
<script defer src="engine.js?v=9a5a4268b660"></script>
<script defer src="save-store.js?v=af8cf02542b4"></script>
<script defer src="backend-client.js?v=71c595460a03"></script>
<script defer src="save-menu.js?v=b04a81eff473"></script>
<script defer src="audio.js?v=b8230b3e01bf"></script>
<script defer src="display-format.js?v=f4b51cbf4c0b"></script>
<script defer src="app.js?v=03bc5ed3e032"></script>
</head>
<body>
<main id="player" aria-label="Survive USYD game">
  <div id="viewport"><div id="stage" aria-label="Game scene"><p class="loading">Loading Survive USYD…</p></div></div>
</main>
<footer id="controls">
  <span id="save-status" role="status">Click dialogue to continue · Space / Enter</span>
  <div class="tools">
    <button id="save-game" hidden>Save</button>
    <button id="load-game" hidden>Load</button>
    <button id="audio-settings" aria-haspopup="dialog" aria-controls="audio-dialog">Audio</button>
    <button id="fullscreen" aria-label="Toggle fullscreen">Fullscreen</button>
    <button id="restart" hidden>New game</button>
  </div>
</footer>
<div id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<dialog id="audio-dialog" aria-labelledby="audio-title">
 <div class="audio-heading"><h2 id="audio-title">A little atmosphere</h2><button id="close-audio" aria-label="Close audio settings">×</button></div>
 <p class="audio-description">A gentle tune for your semester.</p>
 <div class="audio-setting">
  <label class="audio-toggle"><input id="music-enabled" type="checkbox" checked> Background music</label>
  <div class="audio-level"><input id="music-volume" type="range" min="0" max="100" value="28" aria-label="Music volume"><output id="music-level" for="music-volume">28%</output></div>
 </div>
 <div class="audio-setting">
  <label class="audio-toggle"><input id="sound-enabled" type="checkbox" checked> Button sounds</label>
  <div class="audio-level"><input id="sound-volume" type="range" min="0" max="100" value="45" aria-label="Button sound volume"><output id="sound-level" for="sound-volume">45%</output></div>
 </div>
 <p id="audio-note" role="status">Music starts on your first click.</p>
 <form method="dialog"><button>Back to game</button></form>
</dialog>
<dialog id="restart-dialog">
 <h2>Start a new game?</h2><p>Your current autosave will be replaced. Your nine manual save slots will be kept.</p>
 <form method="dialog"><button value="cancel">Keep playing</button><button value="restart">Start new game</button></form>
</dialog>
<noscript>This game needs JavaScript. Please enable it in your browser.</noscript>
</body>
</html>
